# Main CI Workflow
name: CI

on:
  push:
    branches:
      - "main"
      - "*.*"
      - "!*backport*"
    tags:
      - "v*"
      - "!*dev*"
      - "!*pre*"
      - "!*post*"
  pull_request:
  # Allow manual runs through the web UI
  workflow_dispatch:

concurrency:
  # event_name keeps a push to main from cancelling the scheduled performance-regression run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  core:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@22ddf09dfabb443adddfb9f861b7d41a787d6b1a # v3.0.3
    permissions:
      id-token: write
    with:
      submodules: false
      coverage: codecov-oidc
      toxdeps: tox-pypi-filter
      envs: |
        - linux: py313

  performance:
    name: Synthesis performance regression
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@22ddf09dfabb443adddfb9f861b7d41a787d6b1a # v3.0.3
    with:
      submodules: false
      toxdeps: tox-pypi-filter
      envs: |
        - linux: py313
          posargs: -m performance -n 0 --no-cov

  chianti:
    name: CHIANTI and synthesis tutorial integration
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    env:
      XUVTOP: ${{ github.workspace }}/.chianti/CHIANTI_11.0.2_database
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Restore CHIANTI 11.0.2 database
        id: cache-chianti
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .chianti/CHIANTI_11.0.2_database
          key: chianti-database-${{ runner.os }}-11.0.2
      - name: Download CHIANTI 11.0.2 database
        if: steps.cache-chianti.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${XUVTOP}"
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/CHIANTI_11.0.2_database.tar.gz" \
            https://download.chiantidatabase.org/CHIANTI_11.0.2_database.tar.gz
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/CHIANTI_11.0.2_database.tar.gz" \
            --directory "${XUVTOP}"
          test -f "${XUVTOP}/ip/chianti.ip"
      - name: Install integration dependencies
        run: |
          sudo apt-get update && sudo apt-get install --yes graphviz
          uv pip install --system --editable '.[chianti]' \
            pytest pytest-doctestplus pytest-loguru pytest-mpl pytest-remotedata \
            tox tox-uv tox-pypi-filter
      - name: Test live CHIANTI workflows
        run: python -m pytest muse -m chianti
      - name: Build docs with the full synthesis tutorial gallery
        run: tox -e build_docs-fullgallery
      - name: Save CHIANTI 11.0.2 database
        if: |
          steps.cache-chianti.outputs.cache-hit != 'true' &&
          (github.ref == 'refs/heads/main' ||
           github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .chianti/CHIANTI_11.0.2_database
          key: ${{ steps.cache-chianti.outputs.cache-primary-key }}

  sdist_verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - run: uv build --sdist
      - run: uvx twine check dist/*

  test:
    needs: [core, sdist_verify]
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@22ddf09dfabb443adddfb9f861b7d41a787d6b1a # v3.0.3
    permissions:
      id-token: write
    with:
      submodules: false
      coverage: codecov-oidc
      toxdeps: tox-pypi-filter
      envs: |
        - linux: py314
        - windows: py312
        - macos: py312

  docs:
    needs: [core]
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@22ddf09dfabb443adddfb9f861b7d41a787d6b1a # v3.0.3
    with:
      default_python: "3.13"
      submodules: false
      pytest: false
      toxdeps: tox-pypi-filter
      libraries: |
        apt:
          - graphviz
      envs: |
        - linux: build_docs

  build_dists:
    # Build wheels on PRs only when labelled. Releases will only be published if tagged ^v.*
    # see https://github-actions-workflows.openastronomy.org/en/latest/publish.html#upload-to-pypi
    if: |
      github.event_name != 'pull_request' ||
      (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'Run publish')
      )
    needs: [test, docs]
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish_pure_python.yml@22ddf09dfabb443adddfb9f861b7d41a787d6b1a # v3.0.3
    with:
      python-version: "3.13"
      test_extras: "all,tests"
      test_command: 'pytest -p no:warnings --doctest-rst --pyargs muse -m "not mpl_image_compare and not cuda and not performance and not chianti"'
      submodules: false
      save_artifacts: true
      upload_to_pypi: false

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Upload to PyPI
    runs-on: ubuntu-latest
    needs: [build_dists]
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          pattern: dist-*
          path: dist
      - run: ls -lha dist/
      - name: Run upload
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
